name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build web app
        run: bun run build

      - name: Initialize Capacitor Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate app icons & splash
        run: |
          npx capacitor-assets generate \
            --iconBackgroundColor '#4f46e5' \
            --iconBackgroundColorDark '#1e1b4b' \
            --splashBackgroundColor '#4f46e5' \
            --splashBackgroundColorDark '#0f172a'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK to tensiku.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk tensiku.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tensiku.apk
          path: tensiku.apk
          if-no-files-found: error
