name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: bun run build

      - name: Initialize Capacitor Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate app icons & splash
        run: |
          npm install sharp
          npx capacitor-assets generate \
            --iconBackgroundColor '#4f46e5' \
            --iconBackgroundColorDark '#1e1b4b' \
            --splashBackgroundColor '#4f46e5' \
            --splashBackgroundColorDark '#0f172a'

      - name: Sync Capacitor
        run: npx cap sync android


      - name: Bump Android version code
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/g" android/app/build.gradle

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK to tensi.ku.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk tensi.ku.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tensi.ku.apk
          path: tensi.ku.apk
          if-no-files-found: error
